<div class="flex h-full flex-col">
  <!-- Form Content -->
  <div class="flex-1 px-0 md:px-8">
    <div class="mx-auto">
      <form [formGroup]="form!">
        <div class="space-y-8 rounded-2xl bg-white p-8">
          <!-- Image Upload Section -->
          <div class="space-y-4">
            <label
              class="flex items-center gap-2 text-base font-semibold text-gray-800"
            >
              <ion-icon name="image" class="text-blue-600"></ion-icon>
              รูปภาพ
              <span class="text-lg text-red-500">*</span>
            </label>

            <div
              class="flex flex-col items-center gap-6 md:flex-row md:items-start"
            >
              <!-- Image Preview/Upload Area -->
              <app-image-upload
                #menuImageUpload
                [imageDisplay]="imageDisplay"
                (imageChange)="onFileChange($event)"
                (clear)="clearImage()"
                [size]="'md'"
              ></app-image-upload>

              <!-- Upload Instructions -->
              <div class="w-full flex-1 flex flex-col gap-2 md:w-full">
                <div
                  class="w-full rounded-xl border border-blue-200 bg-primary/10 p-5 md:w-full"
                >
                  <h4
                    class="mb-3 flex items-center gap-2 font-semibold text-gray-800"
                  >
                    <ion-icon
                      name="information-circle"
                      class="text-xl text-blue-600"
                    ></ion-icon>
                    คำแนะนำการอัปโหลด
                  </h4>
                  <ul class="space-y-2 text-sm text-gray-700">
                    <li class="flex items-start gap-2">
                      <ion-icon
                        name="checkmark-circle"
                        class="mt-0.5 shrink-0 text-lg text-green-600"
                      ></ion-icon>
                      <span>รองรับไฟล์ภาพ JPG, PNG, GIF</span>
                    </li>
                    <li class="flex items-start gap-2">
                      <ion-icon
                        name="checkmark-circle"
                        class="mt-0.5 shrink-0 text-lg text-green-600"
                      ></ion-icon>
                      <span>ขนาดไฟล์ไม่เกิน 5MB</span>
                    </li>
                    <li class="flex items-start gap-2">
                      <ion-icon
                        name="checkmark-circle"
                        class="mt-0.5 shrink-0 text-lg text-green-600"
                      ></ion-icon>
                      <span>แนะนำขนาดภาพ 800x800 พิกเซล</span>
                    </li>
                  </ul>
                </div>
                <!-- Change Image Button (เมื่อมีรูปแล้ว) -->
                <p-button
                  *ngIf="imageDisplay"
                  type="button"
                  label="อัปโหลดรูปใหม่"
                  icon="pi pi-cloud-upload"
                  [outlined]="true"
                  class="mt-4 w-full"
                  (click)="
                    menuImageUpload.triggerUpload(); $event.stopPropagation()
                  "
                ></p-button>
              </div>
            </div>

            <!-- Error Message -->
            <div
              *ngIf="f?.['imageFile']?.invalid && f?.['imageFile']?.touched"
              class="rounded-lg border-l-4 border-red-500 bg-red-50 p-4"
            >
              <div class="flex items-center gap-2 text-red-700">
                <ion-icon name="alert-circle" class="text-xl"></ion-icon>
                <span class="font-medium">กรุณาอัปโหลดรูปภาพ</span>
              </div>
            </div>
          </div>

          <!-- Divider -->
          <div class="border-t border-gray-200"></div>

          <!-- Form Fields -->
          <div class="grid grid-cols-1 gap-6 md:grid-cols-2">
            <!-- Type -->
            <div class="space-y-2">
              <label for="type" class="text-sm text-gray-600"
                >ประเภทอาหาร</label
              >
              <input
                pInputText
                type="text"
                placeholder="เช่น อาหาร, เครื่องดื่ม"
                formControlName="type"
                (focus)="showType = true"
                (blur)="showType = false"
              />

              <div class="mt-2 space-y-2" *ngIf="!isValid('type')">
                <p class="mb-3 text-xs text-gray-500">เลือกที่ใช้บ่อย</p>
                <div class="flex flex-wrap gap-2">
                  <p-chip
                    *ngFor="let item of helperTypeSelect"
                    [label]="item.name"
                    [style]="{
                      fontSize: '13px',
                      cursor: 'pointer',
                      borderRadius: '16px',
                      padding: '0.5rem 0.875rem',
                    }"
                    styleClass="hover:bg-primary-100"
                    (click)="onClickTypeHelper(item)"
                  ></p-chip>
                </div>
              </div>
            </div>

            <!-- Sub Type -->
            <div class="space-y-2">
              <label for="sub_type" class="text-sm text-gray-600">หมวด</label>
              <input
                pInputText
                type="text"
                placeholder="เช่น กาแฟ, น้ำ"
                formControlName="sub_type"
                (focus)="showSubType = true"
                (blur)="showSubType = false"
              />

              <div
                class="mt-2 space-y-2"
                *ngIf="!isValid('sub_type') && isValid('type')"
              >
                <p class="mb-3 text-xs text-gray-500">เลือกที่ใช้บ่อย</p>
                <div class="flex flex-wrap gap-2">
                  <p-chip
                    *ngFor="let item of subType"
                    [label]="item.name"
                    [style]="{
                      fontSize: '13px',
                      cursor: 'pointer',
                      borderRadius: '16px',
                      padding: '0.5rem 0.875rem',
                    }"
                    styleClass="hover:bg-primary-100"
                    (click)="onClickSubTypeHelper(item)"
                  ></p-chip>
                </div>
              </div>
            </div>

            <div class="col-span-2 space-y-2">
              <label for="name" class="text-sm text-gray-600">ชื่อเมนู</label>
              <input
                pInputText
                type="text"
                placeholder="เช่น ข้าวผัดกะเพรา"
                formControlName="name"
              />
            </div>
          </div>

          <!-- Divider -->
          <div class="border-t border-gray-200"></div>

          <!-- Is Active Toggle -->
          <div
            class="rounded-xl border border-green-500 bg-green-500/10 p-6 transition-all duration-300"
          >
            <div class="flex items-center justify-between">
              <div class="flex-1">
                <label
                  class="mb-2 flex items-center gap-2 text-base font-semibold text-gray-800"
                >
                  <ion-icon name="power" class="text-green-600"></ion-icon>
                  สถานะการใช้งาน
                </label>
                <p class="text-sm text-gray-600">
                  เปิด/ปิด การใช้งานเมนูนี้ในระบบ
                </p>
              </div>
              <div class="ml-6">
                <ion-toggle
                  formControlName="is_active"
                  color="success"
                  class="scale-125"
                ></ion-toggle>
              </div>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>

<ng-template #footer>
  <div class="flex justify-end !border-t !border-gray-200 px-8 py-4">
    <p-button
      [label]="nextLabel()"
      icon="pi pi-arrow-right"
      iconPos="right"
      (click)="goNext()"
    ></p-button>
  </div>
</ng-template>
