<div class="relative"
ngClass="{{cssClass}}"
>
  <!-- Background with border -->
  <div
    class="absolute inset-0 rounded-2xl transition-all duration-300"
    [ngClass]="{
      'border-3 bg-linear-to-br border-blue-400 from-blue-50 to-blue-100':
        !imageDisplay,
      'border-3 border-gray-300 hover:border-blue-500': imageDisplay,
    }"
  ></div>

  <!-- Clickable Area -->
  <div
    (click)="fileInput.click()"
    class="absolute inset-0 cursor-pointer overflow-hidden rounded-2xl border border-primary bg-primary/10 "
  >
    <!-- Preview Image (z-index: 1) -->
    <img
      *ngIf="imageDisplay"
      [src]="imageDisplay"
      alt="Preview"
      style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
      "
      (load)="onImageLoading()"
      (error)="onImageError($event)"
    />

    <!-- Upload Placeholder (แสดงเมื่อไม่มีรูป) -->
    <div
      *ngIf="!imageDisplay"
      class="flex h-full flex-col items-center justify-center text-blue-600"
      style="position: relative; z-index: 2"
    >
      <div
        class="mb-3 rounded-full bg-white p-4 shadow-md transition-transform duration-300 hover:scale-110"
      >
        <ion-icon name="cloud-upload"
        [ngClass]="{
          'text-2xl': size === 'sm',
          'text-5xl': size === 'md' || size === 'lg',
        }"
        ></ion-icon>
      </div>

      <span class="font-semibold"
      [ngClass]="{
        'text-xs': size === 'sm',
        'text-base': size === 'md' || size === 'lg',
      }"
      >อัปโหลดรูป</span>
      <span class="mt-1 text-sm text-gray-500"
      [ngClass]="{
        'text-xs': size === 'sm',
        'text-sm': size === 'md' || size === 'lg',
      }"

      >คลิกเพื่อเลือกไฟล์</span>
    </div>

    <!-- Hover Overlay (z-index: 10 - อยู่บนสุด) -->
    <!-- Hover Overlay (z-index: 10 - อยู่บนสุด) -->
    <div
      *ngIf="imageDisplay"
      class="absolute inset-0 z-10 flex items-center justify-center bg-black/0  transition-all duration-300 opacity-0 hover:opacity-100 hover:bg-black/10"
      (click)="onClear($event)"
    >
      <div
        class="translate-y-1 text-center hover:opacity-100"
      >
        <div class="mb-2 inline-flex rounded-full bg-white/90 p-3 shadow-sm hover:bg-red-50">
          <!-- เปลี่ยนไอคอนเป็น trash/close -->
          <ion-icon name="close-outline" class="text-3xl text-red-500"></ion-icon>
        </div>
        <p class="text-sm font-medium text-white drop-shadow-md">ลบรูปภาพ</p>
      </div>
    </div>
  </div>
</div>

<input
  #fileInput
  type="file"
  accept="image/*"
  class="hidden"
  (change)="onFileChange($event)"
/>
